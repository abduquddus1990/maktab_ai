:root{--bg:#0A0A0F;--card:#1C1C1E;--card2:#2C2C2E;--primary:#FFC800;--text:#FFFFFF;--text2:#8A8A8E;--border:rgba(255,255,255,0.08);--shadow:0 8px 32px rgba(0,0,0,0.45)}

.ni .ms{font-size:22px}.ni span{font-size:11px;font-weight:600}
.ni.active{color:var(--primary)}.ni.active .ms{font-variation-settings:'FILL' 1}
.nc{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:0 8px;flex-shrink:0}

.tag-yellow{background:rgba(255,200,0,.18);color:#FFC800}

        <span style="font-size:12px;color:var(--text2)">${maqola.vaqt} o'qish · ${maqola.sana}</span>
      </div>
      <h2 style="font-size:19px;font-weight:900;font-family:'Montserrat',sans-serif;line-height:1.35;margin-bottom:16px">${maqola.sarlavha}</h2>
      <div style="font-size:14px;line-height:1.8;color:var(--text)">${maqola.matn}</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:100px">
      <button onclick="openAiPanel()" class="clay-btn-p" style="padding:12px 20px;font-size:14px;border-radius:14px;display:flex;align-items:center;gap:8px;flex:1">
        <span style="font-size:18px">🤖</span> AI tushuntirsin
      </button>
    </div>`;
}

renderArticle();

async function maqolaniTushuntir(maqolaMatni){
  const grade=localStorage.getItem('student_grade')||'4';
  const response=await fetch(
    'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=AIzaSyD2nOTfeR0M_Hp-K4goY4d5v4eexby01Ps',
    {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system_instruction:{parts:[{text:
          `Sen MAKTAB AI. Faqat O'zbek tilida (lotin) javob ber.
Bu maqolani ${grade}-sinf o'quvchisiga mos sodda tilda tushuntir.
Maksimum 5 jumla. Muhim so'zlarni **kuchli** ko'rsat.
Oxirida 1 ta savol ber: "Siz ham shu haqida nima o'ylaysiz?"`
        }]},
        contents:[{role:'user',parts:[{text:maqolaMatni}]}],
        generationConfig:{maxOutputTokens:400,temperature:0.5}
      })
    }
  );
  const data=await response.json();
  return data.candidates[0].content.parts[0].text;
}

function openAiPanel(){
  const panel=document.getElementById('aiPanel');
  panel.classList.add('open');
  document.getElementById('aiContent').innerHTML=`
    <div style="display:flex;align-items:center;gap:6px;color:var(--text2)">
      <span style="font-size:13px">Maktab AI yozmoqda</span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>`;
  document.getElementById('aiActions').innerHTML='';

  const plainText=maqola.sarlavha+'\n'+maqola.matn.replace(/<[^>]+>/g,' ');
  maqolaniTushuntir(plainText).then(text=>{
    const formatted=text
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.*?)\*/g,'<em>$1</em>')
      .replace(/\n/g,'<br>');
    document.getElementById('aiContent').innerHTML=`<div style="font-size:14px;line-height:1.7">${formatted}</div>`;
    const grade=localStorage.getItem('student_grade')||'4';
    const fan=localStorage.getItem('last_fan')||'Tarix';
    document.getElementById('aiActions').innerHTML=`
      <button onclick="location.href='chat.html?fan=${encodeURIComponent(fan)}&sinf=${grade}'" class="clay-btn-p" style="width:100%;height:46px;font-size:14px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px">
        <span class="ms" style="font-size:18px;color:#141414;font-variation-settings:'FILL' 1">forum</span>
        Savolim bor — AI bilan suhbat
      </button>`;
  }).catch(()=>{
    document.getElementById('aiContent').innerHTML=`<div style="color:#F87171;font-size:14px">Xatolik yuz berdi. Qayta urinib ko'ring.</div>`;
  });
}

function closeAiPanel(){
  document.getElementById('aiPanel').classList.remove('open');
}

if(autoAI){
  setTimeout(openAiPanel,600);
}
</script>
