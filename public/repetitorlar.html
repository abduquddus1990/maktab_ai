<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Repetitorlar — Maktab AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#fbf8ff;color:#12183b}
.mont{font-family:'Montserrat',sans-serif}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;font-size:14px;font-weight:600;border:1.5px solid #E7E9F4;background:#fff;color:#464557;cursor:pointer;transition:all .2s;white-space:nowrap}
.chip:hover,.chip.active{background:#4b3bff;border-color:#4b3bff;color:#fff}
.chip-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.ustoz-card{background:#fff;border-radius:20px;padding:24px;border:1px solid #E7E9F4;transition:all .2s}
.ustoz-card:hover{box-shadow:0 12px 30px rgba(20,26,61,.1);transform:translateY(-3px)}
.search-box{width:100%;padding:14px 18px 14px 50px;border:1.5px solid #E7E9F4;border-radius:12px;font-size:15px;font-family:'Inter',sans-serif;outline:none;background:#fff;transition:border-color .2s;color:#12183b}
.search-box:focus{border-color:#4b3bff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.subj-chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;background:#fff;border:1.5px solid #E7E9F4;border-radius:16px;cursor:pointer;transition:all .2s;font-size:13px;font-weight:600;color:#464557;text-align:center;min-width:80px}
.subj-chip:hover,.subj-chip.active{border-color:#4b3bff;background:#f0eeff;color:#4b3bff}
.subj-chip .icon{font-size:24px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="nav-ph"></div>

<!-- HEADER -->
<section style="background:linear-gradient(135deg,#4b3bff 0%,#7c5cbf 100%);padding:56px 0 40px">
  <div class="container" style="text-align:center">
    <h1 class="mont" style="font-size:clamp(28px,4vw,44px);font-weight:900;color:#fff;margin-bottom:14px">Eng yaxshi repetitorlarni toping</h1>
    <p style="font-size:17px;color:rgba(255,255,255,.8);margin-bottom:28px">640+ tasdiqlangan ustoz · Online va oflayn darslar</p>
    <!-- Search -->
    <div style="max-width:560px;margin:0 auto;position:relative">
      <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px">🔍</span>
      <input type="text" class="search-box" id="search-input" placeholder="Ustoz nomi yoki fan bo'yicha qidiring..." oninput="filterCards()">
    </div>
  </div>
</section>

<div style="padding:40px 0 80px">
  <div class="container">

    <!-- FANLAR GRID -->
    <div style="margin-bottom:40px">
      <div class="mont" style="font-weight:800;font-size:16px;color:#12183b;margin-bottom:16px">Fan tanlang</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap" id="fan-chips">
        <div class="subj-chip active" data-fan="" onclick="filterByFan(this,'')"><span class="icon">📋</span>Barchasi</div>
        <div class="subj-chip" data-fan="Matematika" onclick="filterByFan(this,'Matematika')"><span class="icon">📐</span>Matematika</div>
        <div class="subj-chip" data-fan="Fizika" onclick="filterByFan(this,'Fizika')"><span class="icon">⚡</span>Fizika</div>
        <div class="subj-chip" data-fan="Kimyo" onclick="filterByFan(this,'Kimyo')"><span class="icon">🧪</span>Kimyo</div>
        <div class="subj-chip" data-fan="Biologiya" onclick="filterByFan(this,'Biologiya')"><span class="icon">🧬</span>Biologiya</div>
        <div class="subj-chip" data-fan="Ingliz tili" onclick="filterByFan(this,'Ingliz tili')"><span class="icon">🇬🇧</span>Ingliz tili</div>
        <div class="subj-chip" data-fan="Ona tili" onclick="filterByFan(this,'Ona tili')"><span class="icon">📝</span>Ona tili</div>
        <div class="subj-chip" data-fan="Geografiya" onclick="filterByFan(this,'Geografiya')"><span class="icon">🌍</span>Geografiya</div>
      </div>
    </div>

    <!-- FILTER CHIPS -->
    <div style="margin-bottom:32px">
      <div class="chip-row">
        <div class="chip active" onclick="filterByStatus(this,'all')">Barchasi</div>
        <div class="chip" onclick="filterByStatus(this,'live')">🟢 Hozir jonli</div>
        <div class="chip" onclick="filterByStatus(this,'top')">⭐ Top ustozlar</div>
      </div>
    </div>

    <!-- COUNT -->
    <div style="margin-bottom:20px;font-size:15px;color:#464557">
      Topildi: <span id="count-txt" class="mont" style="font-weight:800;color:#4b3bff">10</span> ta ustoz
    </div>

    <!-- CARDS -->
    <div class="grid" id="cards-grid"></div>

  </div>
</div>

<div id="footer-ph"></div>

<script src="/js/components.js"></script>
<script src="/js/marketplace.js"></script>
<script>
let activeFan = '';
let activeStatus = 'all';

function renderCards(list) {
  const grid = document.getElementById('cards-grid');
  document.getElementById('count-txt').textContent = list.length;
  if (!list.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#464557;font-size:16px">Ustoz topilmadi 😔 Boshqa qidiruv kiriting</div>';
    return;
  }
  grid.innerHTML = list.map(u => `
    <div class="ustoz-card">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <div style="width:52px;height:52px;background:${u.gradient};border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:900;font-size:18px;color:#fff;flex-shrink:0">${u.avatar}</div>
        <div style="flex:1;min-width:0">
          <div class="mont" style="font-weight:800;font-size:16px;color:#12183b">${u.ism}</div>
          <div style="font-size:13px;color:#464557;margin-top:2px">${u.fan} · ${u.sinflar}</div>
        </div>
        ${u.jonli ? '<div style="font-size:12px;font-weight:700;color:#22c55e;background:#f0fdf4;padding:4px 12px;border-radius:999px;white-space:nowrap;flex-shrink:0">🟢 Jonli</div>' : ''}
      </div>
      <div style="display:flex;gap:16px;margin-bottom:16px;font-size:13px;color:#464557">
        <span>⭐ <strong>${u.reyting}</strong> (${u.izohlar} ta)</span>
        <span>🕐 ${u.tajriba} tajriba</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid #E7E9F4">
        <div class="mont" style="font-weight:800;font-size:15px;color:#12183b">${u.narx}</div>
        <div style="display:flex;gap:8px">
          <a href="/ustoz-profili.html?id=${u.id}" style="padding:9px 16px;border:1.5px solid #E7E9F4;border-radius:10px;font-size:13px;font-weight:600;color:#464557;text-decoration:none;transition:all .2s" onmouseover="this.style.borderColor='#4b3bff';this.style.color='#4b3bff'" onmouseout="this.style.borderColor='#E7E9F4';this.style.color='#464557'">Profil</a>
          <a href="/ustoz-profili.html?id=${u.id}" style="padding:9px 16px;background:#4b3bff;border-radius:10px;font-size:13px;font-weight:700;color:#fff;text-decoration:none;transition:background .2s" onmouseover="this.style.background='#2f06e9'" onmouseout="this.style.background='#4b3bff'">Band qilish</a>
        </div>
      </div>
    </div>
  `).join('');
}

function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase();
  return window.USTOZLAR.filter(u => {
    const matchFan = !activeFan || u.fan === activeFan;
    const matchStatus = activeStatus === 'all' || (activeStatus === 'live' && u.jonli) || (activeStatus === 'top' && u.reyting >= 4.8);
    const matchSearch = !q || u.ism.toLowerCase().includes(q) || u.fan.toLowerCase().includes(q);
    return matchFan && matchStatus && matchSearch;
  });
}

function filterCards() { renderCards(getFiltered()); }

function filterByFan(el, fan) {
  document.querySelectorAll('#fan-chips .subj-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeFan = fan;
  filterCards();
}

function filterByStatus(el, status) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeStatus = status;
  filterCards();
}

renderCards(window.USTOZLAR);

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
</script>
</body>
</html>
