<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Guruh Chat — Maktab AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#fbf8ff;color:#12183b;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.mont{font-family:'Montserrat',sans-serif}
.ms{font-family:'Material Symbols Outlined';font-size:22px;line-height:1;user-select:none}
.app{display:flex;flex:1;overflow:hidden;height:calc(100dvh - 56px)}

/* Left panel */
.lpanel{width:240px;background:#fff;border-right:1px solid #E7E9F4;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lpanel-header{padding:16px;border-bottom:1px solid #E7E9F4;flex-shrink:0}
.member-list{flex:1;overflow-y:auto;padding:12px 8px}
.member-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s}
.member-item:hover{background:#f8f8fc}
.m-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;color:#fff;flex-shrink:0}

/* Chat main */
.chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-header{background:#fff;border-bottom:1px solid #E7E9F4;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}

/* Pinned */
.pinned-bar{background:linear-gradient(135deg,#fffbeb,#fff8e1);border-bottom:1.5px solid #fde68a;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0}

/* Messages */
.msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;scrollbar-color:#E7E9F4 transparent}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-thumb{background:#E7E9F4;border-radius:2px}
.msg-group{display:flex;flex-direction:column;margin-bottom:12px}
.msg-row{display:flex;align-items:flex-start;gap:10px;max-width:75%}
.msg-row.mine{flex-direction:row-reverse;align-self:flex-end}
.m-ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:11px;color:#fff;flex-shrink:0;margin-top:2px}
.bub{padding:10px 14px;border-radius:4px 16px 16px 16px;font-size:14px;line-height:1.6;position:relative;word-break:break-word}
.bub.other{background:#fff;border:1px solid #E7E9F4;box-shadow:0 2px 8px rgba(20,26,61,.05)}
.bub.mine{background:#4b3bff;color:#fff;border-radius:16px 4px 16px 16px}
.bub.teacher-bub{background:#f0eeff;border:1px solid #d4cfff}
.msg-meta{font-size:11px;color:#c7c4da;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.msg-meta.mine-meta{justify-content:flex-end}
.report-btn{display:none;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:6px;color:#c7c4da;font-family:'Material Symbols Outlined';font-size:14px;transition:color .15s}
.report-btn:hover{color:#f97316}
.bub:hover .report-btn{display:inline-flex}
/* Input */
.input-area{background:#fff;border-top:1px solid #E7E9F4;padding:14px 20px;flex-shrink:0}
.input-row{display:flex;align-items:flex-end;gap:10px}
.tinput{flex:1;background:#f8f8fc;border:1.5px solid #E7E9F4;border-radius:14px;padding:11px 16px;font-size:15px;font-family:'Inter',sans-serif;resize:none;min-height:46px;max-height:120px;outline:none;transition:border-color .2s;line-height:1.5;color:#12183b}
.tinput:focus{border-color:#4b3bff;background:#fff}
.send-btn{width:46px;height:46px;background:#4b3bff;border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;box-shadow:0 4px 12px rgba(75,59,255,.25)}
.send-btn:hover{background:#2f06e9}
.send-btn .ms{color:#fff;font-size:22px}
/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#12183b;color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;z-index:500;white-space:nowrap}
.toast.show{opacity:1}
/* mobile */
.mob-sidebar-btn{display:none;background:none;border:none;cursor:pointer;padding:4px;color:#464557}
@media(max-width:768px){
  .lpanel{display:none;position:fixed;left:0;top:0;bottom:0;z-index:200;box-shadow:4px 0 20px rgba(0,0,0,.12);width:260px}
  .lpanel.open{display:flex}
  .mob-sidebar-btn{display:flex}
  .msg-row{max-width:88%}
}
</style>
</head>
<body>
<!-- TOP NAV -->
<div style="background:#fff;border-bottom:1px solid #E7E9F4;height:56px;display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;z-index:50">
  <button class="mob-sidebar-btn" onclick="togglePanel()"><span class="ms" style="font-size:24px">menu</span></button>
  <a href="/guruhlar.html" style="display:flex;align-items:center;gap:6px;text-decoration:none;color:#464557;font-size:14px;font-weight:600">
    <span class="ms" style="font-size:20px">arrow_back</span> Guruhlar
  </a>
  <div style="flex:1"></div>
  <a href="/index.html" style="display:flex;align-items:center;gap:8px;text-decoration:none">
    <img src="/logo.png" alt="Maktab AI" style="height:28px;object-fit:contain">
  </a>
</div>

<div class="app">
  <!-- LEFT PANEL -->
  <aside class="lpanel" id="lpanel">
    <div class="lpanel-header">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div id="lp-avatar" style="width:40px;height:40px;border-radius:12px;background:#4b3bff;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:800;color:#fff;font-size:14px"></div>
        <div>
          <div class="mont" style="font-weight:800;font-size:14px;color:#12183b" id="lp-name">Guruh</div>
          <div style="font-size:12px;color:#464557" id="lp-subject">Fan</div>
        </div>
      </div>
      <a href="/guruh-taklif.html" id="invite-btn" style="display:flex;align-items:center;gap:6px;padding:8px 12px;background:#f0eeff;border-radius:10px;text-decoration:none;color:#4b3bff;font-size:13px;font-weight:600">
        <span class="ms" style="font-size:16px">person_add</span> A'zo taklif qilish
      </a>
    </div>
    <div style="padding:8px 12px;font-size:11px;font-weight:700;color:#c7c4da;letter-spacing:.5px;text-transform:uppercase">A'zolar</div>
    <div class="member-list" id="member-list"></div>
    <div style="padding:12px;border-top:1px solid #E7E9F4;margin-top:auto">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#4b3bff;font-weight:600;padding:8px;background:#f0eeff;border-radius:10px">
        <span class="ms" style="font-size:16px">shield</span> Bu guruh ustoz nazoratida
      </div>
    </div>
  </aside>

  <!-- CHAT MAIN -->
  <main class="chat-main">
    <!-- Header -->
    <div class="chat-header">
      <div id="ch-avatar" style="width:36px;height:36px;border-radius:10px;background:#4b3bff;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:800;color:#fff;font-size:13px;flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        <div class="mont" style="font-weight:800;font-size:15px;color:#12183b" id="ch-name">Yuklanmoqda...</div>
        <div style="font-size:12px;color:#464557" id="ch-sub"></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding:6px 12px;background:#f0fdf4;border-radius:999px;border:1px solid #bbf7d0">
        <span class="ms" style="font-size:16px;color:#22c55e">shield</span>
        <span style="font-size:12px;font-weight:600;color:#22c55e">Ustoz nazoratida 🛡️</span>
      </div>
    </div>

    <!-- Pinned (if any) -->
    <div class="pinned-bar" id="pinned-bar" style="display:none">
      <span class="ms" style="font-size:18px;color:#f59e0b">push_pin</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;font-weight:700;color:#92400e;margin-bottom:2px">USTOZ E'LONI</div>
        <div style="font-size:13px;color:#78350f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="pinned-text"></div>
      </div>
    </div>

    <!-- Messages -->
    <div class="msgs" id="msgs"></div>

    <!-- Input -->
    <div class="input-area">
      <div id="blocked-msg" style="display:none;padding:10px 14px;background:#fff7ed;border-radius:10px;font-size:13px;color:#92400e;margin-bottom:10px;border:1px solid #fed7aa">
        ⚠️ Siz bu guruhga hali qo'shilmagansiz yoki so'rovingiz tasdiqlanmagan.
      </div>
      <div class="input-row">
        <textarea class="tinput" id="msg-input" placeholder="Xabar yozing... (Enter — yuborish)" rows="1"></textarea>
        <button class="send-btn" onclick="sendMsg()"><span class="ms">send</span></button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/js/groups.js"></script>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
function getCurrentUser(){ try{return JSON.parse(localStorage.getItem('maktabai_currentUser'));}catch{return null;} }
function togglePanel(){ document.getElementById('lpanel').classList.toggle('open'); }

const params=new URLSearchParams(location.search);
const groupId=params.get('id');
const cu=getCurrentUser();

if(!groupId){ location.href='/guruhlar.html'; }

GS.seedDemo(cu);

const group=GS.getGroupById(groupId);
if(!group){ location.href='/guruhlar.html'; }

/* Setup invite link */
document.getElementById('invite-btn').href=`/guruh-taklif.html?id=${groupId}`;

const uid=cu?String(cu.id):'s1';
const role=group.ownerId===uid?'teacher':(GS.getMemberRole(groupId,uid)||null);
const status=role==='teacher'?'approved':GS.getMemberStatus(groupId,uid);
const canChat=status==='approved';

/* Header */
document.title=group.name+' — Maktab AI';
const chAva=document.getElementById('ch-avatar');
chAva.textContent=initials(group.name);
chAva.style.background=group.color;
document.getElementById('ch-name').textContent=group.name;
document.getElementById('ch-sub').textContent=`${group.subject} · ${group.grade}-sinf · 👨‍🏫 ${group.ownerName}`;
const lpAva=document.getElementById('lp-avatar');
lpAva.textContent=initials(group.name);
lpAva.style.background=group.color;
document.getElementById('lp-name').textContent=group.name;
document.getElementById('lp-subject').textContent=`${group.subject} · ${group.grade}-sinf`;

if(!canChat){
  document.getElementById('blocked-msg').style.display='block';
  document.getElementById('msg-input').disabled=true;
  document.querySelector('.send-btn').disabled=true;
}

/* Members */
function renderMembers(){
  const members=GS.getGroupMembers(groupId).filter(m=>m.status==='approved');
  const list=document.getElementById('member-list');
  const colors=['#4b3bff','#22c55e','#f97316','#ec4899','#06b6d4','#f59e0b','#7c5cbf'];
  list.innerHTML=members.map((m,i)=>`
    <div class="member-item">
      <div class="m-avatar" style="background:${colors[i%colors.length]}">${initials(m.userName)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:#12183b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.userName}</div>
        <div style="font-size:11px;color:#464557">${m.role==='teacher'?'👨‍🏫 Ustoz':'O\'quvchi'}</div>
      </div>
    </div>`).join('');
}
renderMembers();

/* Messages */
const colors=['#4b3bff','#22c55e','#f97316','#ec4899','#06b6d4','#f59e0b','#7c5cbf','#8b5cf6'];
const colorMap={};
let ci=0;
function getColor(uid){ if(!colorMap[uid]){colorMap[uid]=colors[ci++%colors.length];} return colorMap[uid]; }

function renderMessages(){
  const msgs=GS.getGroupMessages(groupId);
  const pinned=msgs.find(m=>m.pinned);
  const msgsEl=document.getElementById('msgs');

  /* Pinned bar */
  if(pinned){
    document.getElementById('pinned-bar').style.display='flex';
    document.getElementById('pinned-text').textContent=pinned.text;
  }

  if(msgs.length===0){
    msgsEl.innerHTML=`<div style="text-align:center;padding:40px 20px;color:#c7c4da"><span class="ms" style="font-size:48px;display:block;margin-bottom:12px">chat_bubble_outline</span><div class="mont" style="font-size:16px;font-weight:700">Hali xabar yo'q</div><div style="font-size:13px;margin-top:4px">Birinchi xabarni yozing!</div></div>`;
    return;
  }

  msgsEl.innerHTML=msgs.filter(m=>!m.flagged||(m.userId===uid)).map(m=>{
    const isMe=m.userId===uid;
    const isTeacher=m.userId===group.ownerId;
    const color=isTeacher?group.color:getColor(m.userId);
    return `<div class="msg-group">
      <div class="msg-meta ${isMe?'mine-meta':''}">
        ${isMe?'':`<span style="color:${color};font-size:12px">${m.userName}${isTeacher?' 👨‍🏫':''}</span>`}
        <span>${timeAgo(m.createdAt)}</span>
      </div>
      <div class="msg-row ${isMe?'mine':''}">
        ${isMe?'':`<div class="m-ava" style="background:${color}">${initials(m.userName)}</div>`}
        <div class="bub ${isMe?'mine':isTeacher?'teacher-bub':'other'}" style="position:relative">
          ${m.text}
          ${!isMe?`<button class="report-btn" onclick="reportMsg('${m.id}')" title="Shikoyat qilish">flag</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  msgsEl.scrollTop=msgsEl.scrollHeight;
}
renderMessages();

/* Send */
const input=document.getElementById('msg-input');
input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} });
input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; });

function sendMsg(){
  if(!canChat) return;
  const text=input.value.trim();
  if(!text) return;

  if(moderateText(text)){
    const userName=cu?cu.name:'Siz';
    GS.sendMessage(groupId, uid, userName, text, true);
    input.value=''; input.style.height='auto';
    showToast('Xabaringiz tekshiruvga yuborildi 🔍 Ustoz ko\'rib chiqadi.');
    return;
  }

  const userName=cu?cu.name:'Demo O\'quvchi';
  GS.sendMessage(groupId, uid, userName, text, false);
  input.value=''; input.style.height='auto';
  renderMessages();
}

function reportMsg(id){
  if(confirm('Bu xabarni shikoyat qilmoqchimisiz?')){ GS.flagMessage(id); renderMessages(); showToast('Shikoyat yuborildi. Ustoz ko\'rib chiqadi.'); }
}

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

/* Close panel on backdrop */
document.addEventListener('click',e=>{ if(window.innerWidth<=768&&document.getElementById('lpanel').classList.contains('open')&&!e.target.closest('#lpanel')&&!e.target.closest('.mob-sidebar-btn')) document.getElementById('lpanel').classList.remove('open'); });
</script>
</body>
</html>
